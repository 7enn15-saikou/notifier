name: eplus-monitor

# 手動実行のみ。Actionsタブ →「eplus-monitor」→「Run workflow」で開始する。
on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "監視する時間（分）。30〜300の整数。1分おきに確認"
        type: string
        default: "180"
      send_test:
        description: "LINEにテスト通知を1通送る"
        type: boolean
        default: false

permissions:
  contents: write # state.json（前回の状態）をリポジトリに保存するため

# 二重に実行しない（2つ起動した場合、後のものは前のものが終わるまで待つ）
concurrency:
  group: eplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 300分の監視＋準備時間に余裕を持たせた値（GitHubの上限は360分）
    steps:
      - name: Validate monitoring minutes
        env:
          MINUTES: ${{ inputs.loop_minutes || '180' }}
        run: |
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || [ "$MINUTES" -lt 30 ] || [ "$MINUTES" -gt 300 ]; then
            echo "::error::監視時間は30〜300の整数（分）で入力してください（入力された値: $MINUTES）"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send LINE test message
        if: ${{ inputs.send_test }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python monitor.py --test

      - name: Check ticket status
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LOOP_COUNT: ${{ inputs.loop_minutes || '180' }}  # 1分おきなので、分数 = 確認回数
          INTERVAL_SECONDS: "60"
          ERROR_ALERT_THRESHOLD: "5"  # 取得に5回続けて失敗したらLINEで警告
        run: python monitor.py

      - name: Save state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git pull --rebase
            git push
          fi
