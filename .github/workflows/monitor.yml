name: eplus-monitor

on:
  schedule:
    # GitHub Actionsの時刻はUTC（日本時間 - 9時間）。
    # 30分おきに起動し、1回の実行（約30分）の中で1分おきに確認し続ける。
    # 毎時0分・5分ちょうどは混んで遅れやすいので、7分・37分にずらしている。
    # 日本時間 10:07〜21:07 に起動 = UTC 01:07〜12:07
    - cron: "7,37 1-11 * * *"  # 日本時間 10:07〜20:37
    - cron: "7 12 * * *"       # 日本時間 21:07
  workflow_dispatch: # 手動実行ボタン用
    inputs:
      send_test:
        description: "LINEにテスト通知を1通送る"
        type: boolean
        default: false

permissions:
  contents: write # state.json（前回の状態）をリポジトリに保存するため

# 前の実行が終わるまで次を待たせる（重ならずに、ほぼ連続して動く）
concurrency:
  group: eplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send LINE test message
        if: ${{ inputs.send_test }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python monitor.py --test

      - name: Check ticket status
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LOOP_COUNT: "30"         # 1回の実行で30回確認
          INTERVAL_SECONDS: "60"   # 60秒おき（= 約30分間）
          # 自動実行のときだけ、日本時間 21:30 で確認を終える（手動実行は時間帯に関係なく動く）
          ENFORCE_HOURS: ${{ github.event_name == 'schedule' }}
          ACTIVE_UNTIL_JST: "21:30"
        run: python monitor.py

      - name: Save state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git pull --rebase
            git push
          fi
