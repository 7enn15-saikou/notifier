name: eplus-monitor

on:
  schedule:
    # GitHub Actionsの時刻はUTC（日本時間 - 9時間）。5分おき。
    # 日本時間 10:00〜21:25 に動かす = UTC 01:00〜12:25
    - cron: "*/5 1-11 * * *"   # 日本時間 10:00〜20:55
    - cron: "0-25/5 12 * * *"  # 日本時間 21:00〜21:25
  workflow_dispatch: # 手動実行ボタン用
    inputs:
      send_test:
        description: "LINEにテスト通知を1通送る"
        type: boolean
        default: false

permissions:
  contents: write # state.json（前回の状態）をリポジトリに保存するため

concurrency:
  group: eplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send LINE test message
        if: ${{ inputs.send_test }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python monitor.py --test

      - name: Check ticket status
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LOOP_COUNT: "5"          # 1回の実行で5回確認
          INTERVAL_SECONDS: "60"   # 60秒おき（= 約4分間で5回）
        run: python monitor.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
