name: eplus-monitor

# 手動実行のみ。Actionsタブ →「eplus-monitor」→「Run workflow」で開始する。
on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "監視する時間（分）。30〜300の整数。40秒おきに確認"
        type: string
        default: "180"
      send_start_notice:
        description: "開始のお知らせをDiscordに送る（例：これより180分間、確認を行います）"
        type: boolean
        default: false

permissions:
  contents: write # state.json（前回の状態）をリポジトリに保存するため

# 確認の間隔（秒）。ここを変えれば、確認の間隔を変えられる
# DISCORD_WEBHOOK_URL は、GitHubのSecretsに登録したDiscordのウェブフックURL
env:
  INTERVAL_SECONDS: "40"
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

# 二重に実行しない（2つ起動した場合、後のものは前のものが終わるまで待つ）
concurrency:
  group: eplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 300分の監視＋準備時間に余裕を持たせた値（GitHubの上限は360分）
    steps:
      - name: Validate monitoring minutes
        env:
          MINUTES: ${{ inputs.loop_minutes || '180' }}
        run: |
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || [ "$MINUTES" -lt 30 ] || [ "$MINUTES" -gt 300 ]; then
            echo "::error::監視時間は30〜300の整数（分）で入力してください（入力された値: $MINUTES）"
            exit 1
          fi

      - name: Check Discord webhook is set
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Secretsに DISCORD_WEBHOOK_URL が登録されていません。通知が送れないので、監視を始めません。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Announce start on Discord
        if: ${{ inputs.send_start_notice }}
        env:
          MINUTES: ${{ inputs.loop_minutes || '180' }}
        run: python monitor.py --announce "$MINUTES"

      - name: Check ticket status
        env:
          DURATION_MINUTES: ${{ inputs.loop_minutes || '180' }}  # 確認の回数は、時間と間隔から自動で計算
          ERROR_ALERT_THRESHOLD: "5"  # 取得に5回続けて失敗したらDiscordで警告
        run: python monitor.py

      # 「Cancel workflow」で途中で止めたときに、Discordへ知らせる
      - name: Notify cancelled
        if: ${{ cancelled() }}
        run: |
          NOW=$(TZ=Asia/Tokyo date '+%H:%M')
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"🛑 実行が途中で中止されました（${NOW}）。\\n再開する場合は、もう一度「Run workflow」を押してください。\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Save state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git pull --rebase
            git push
          fi
